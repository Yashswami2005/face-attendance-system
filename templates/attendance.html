<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Attendance Records</title>
  <style>
    body {
      font-family: Inter, Arial;
      background: #f0f4f8;
      margin: 0;
      padding: 40px;
      color: #0f1724;
    }
    .card {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(13,38,76,0.08);
      padding: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    th {
      background: #f3f4f6;
    }
    a.btn {
      display: inline-block;
      margin: 5px 5px 10px 0;
      padding: 8px 14px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    a.btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📋 Attendance Records</h2>
    <a href="/export_csv" class="btn">⬇️ Export as CSV</a>
    <a href="/admin" class="btn">⬅️ Back to Dashboard</a>

    <table>
      <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Branch</th>
        <th>Division</th>
        <th>Date</th>
        <th>Hour</th>
        <th>Time</th>
      </tr>

      {% for row in records %}
      <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
        <td>{{ row[5] }}</td>
        <td>{{ row[6] }}</td>
      </tr>
      {% endfor %}
    </table>
  </div>
</body>
</html>
